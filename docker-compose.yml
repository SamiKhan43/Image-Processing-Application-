version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-processing-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env file}
      DATABASE_URL: sqlite:////data/images.db
    volumes:
      - database:/data
      - image_storage:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  database:
  image_storage:
